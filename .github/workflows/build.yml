name: Build Azangoo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Zip file not found"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --stacktrace

      - name: Publish Direct APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk Azangoo.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" Azangoo.apk --title "Azangoo $TAG" --notes "فایل مستقیم و آماده نصب اذانگو"
